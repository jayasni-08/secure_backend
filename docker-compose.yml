
services:

  backend:
    build: .
    container_name: secure_backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/secure_backend
      JWT_SECRET_KEY: change-this-to-a-long-random-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MAX_FILE_SIZE: 5242880
      UPLOAD_DIR: /app/uploads

    volumes:
      - ./uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:16
    container_name: secure_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secure_backend

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secure_backend"]
      interval: 5s
      timeout: 5s
      retries: 5


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: secure_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data:

